<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Mouse CSV Logger</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; margin: 14px; width: 300px; }
    h3 { margin: 0 0 10px; }
    .row { display: flex; gap: 8px; margin: 8px 0; align-items: center; flex-wrap: wrap; }
    button { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; background: #fff; }
    .sep { height: 1px; background: #eee; margin: 10px 0; }
    .status { font-size: 12px; color: #555; }
    .count { font-weight: 600; }
    label { font-size: 12px; color: #333; display: flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <h3>Mouse CSV Logger</h3>

  <div class="row">
    <button id="exportBtn">CSV 내보내기</button>
    <button id="clearBtn">초기화</button>
  </div>

  <div class="row">
    <label><input type="checkbox" id="throttleMove" checked> 이동 샘플링(약 20Hz)</label>
    <label><input type="checkbox" id="minStep" checked> 2px 미만 이동 무시</label>
  </div>

  <div class="sep"></div>

  <div class="status">
    상태: <span id="status">자동 기록 중</span><br/>
    수집 이벤트: <span class="count" id="eventCount">0</span> 개
  </div>

  <script src="popup.js"></script>
</body>
</html>
