<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>키보드·마우스 CSV 내보내기</title>
    <style>
      :root{--bg1:#f6f3ff;--bg2:#e9f0ff;--card:#ffffffaa;--border:#e8e8ff;--text:#2b2b2f;--sub:#6b6b78;}
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
        color:var(--text);
        background:linear-gradient(180deg, var(--bg1), #ffffff);
        display:grid;place-items:center;padding:24px;
      }
      .card{
        width:min(620px,94vw);background:var(--card);backdrop-filter:blur(10px);
        border:1px solid var(--border);border-radius:20px;padding:24px 24px 28px;
      }
      h1{margin:0 0 12px;font-size:22px;font-weight:800;color:#4b3cc4}
      p{margin:0 0 16px;color:var(--sub);font-size:14px}
      .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
      button{
        appearance:none;border:none;cursor:pointer;font-size:14px;font-weight:700;
        padding:10px 14px;border-radius:10px;color:#fff;background:#6c5ce7
      }
      button.green{background:#00a883}
      button.red{background:#ff6b6b}
      label{font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px}
      .sep{height:1px;background:var(--border);margin:14px 0}
      .status{font-size:13px;color:var(--sub)}
      .status .count{font-weight:800;color:#4b3cc4}
    </style>
  </head>

  <body>
    <div class="card">
      <h1>키보드·마우스 CSV 내보내기</h1>
      <p>일반 웹페이지에서 활동을 수집합니다.</p>

      <div class="row">
        <button id="expMouse" type="button">마우스 좌표 CSV</button>
        <button id="expKeys"  class="green" type="button">키 이벤트 CSV</button>
        <button id="expText" type="button">텍스트 커밋 CSV</button>
        <button id="clear"    class="red" type="button">버퍼 비우기</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="throttleMove" checked> 이동 샘플링(약 20Hz)</label>
        <label><input type="checkbox" id="minStep" checked> 2px 미만 이동 무시</label>
      </div>

      <div class="sep"></div>

      <div class="status">
        상태: <span id="status">자동 기록 중</span><br/>
        수집 이벤트: <span class="count" id="eventCount">0</span> 개
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
